<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONKOD FOOTBALL CLUB</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090909;
  color: white;
}
header {
  background: #151515;
  text-align: center;
  padding: 35px 15px;
  border-bottom: 3px solid #d4af37;
}
.logo {
  font-size: 25px;
  color: #d4af37;
  font-weight: bold;
}
.hero {
  text-align: center;
  padding: 55px 15px;
  background: linear-gradient(135deg,#111,#25200e);
}
.hero h1 {
  font-size: 42px;
  color: #d4af37;
  margin: 10px;
}
.hero p { color: #ddd; }
section {
  padding: 35px 18px;
  max-width: 900px;
  margin: auto;
}
h2 {
  color: #d4af37;
  text-align: center;
  font-size: 28px;
}
.captain {
  background: #24200f;
  border: 2px solid #d4af37;
  border-radius: 12px;
  padding: 25px 20px;
  text-align: center;
  margin: 20px 0;
}
/* Sawirka Kapteenka oo qaab goobo ah iyo xarrago leh */
.captain-img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #d4af37;
  margin: 0 auto 15px auto;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
  display: block;
}
.captain h3 {
  font-size: 24px;
  color: #d4af37;
  margin: 10px 0 5px 0;
}
.captain p {
  color: #ddd;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
}
.squad {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 12px;
}
.player {
  background: #191919;
  border: 1px solid #50421b;
  padding: 17px;
  border-radius: 10px;
  font-weight: bold;
}
.number {
  color: #d4af37;
  font-size: 21px;
  margin-right: 10px;
}
footer {
  background: #151515;
  border-top: 2px solid #d4af37;
  padding: 25px;
  text-align: center;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">🇸🇴 ONKOD FC</div>
  <p>OFFICIAL FOOTBALL CLUB WEBSITE</p>
</header>

<div class="hero">
  <h1>ONKOD FOOTBALL CLUB</h1>
  <p>ONE TEAM. ONE DREAM. ONE FAMILY.</p>
</div>

<section>
  <h2>👑 OUR CAPTAIN</h2>
  <div class="captain">
    <!-- Sawirkaaga halkan ayuu ka muuqanayaa -->
    <img class="captain-img" src="https://lh3.googleusercontent.com/d/1X1c64uJ9LqJ163Yx5n5i4x_S3x7X4Z2V" alt="Sadiek Kazim">
    <h3>SADIEK KAZIM</h3>
    <p>NUMBER 22 · TEAM CAPTAIN · LEFT WINGER (LWF)</p>
  </div>
</section>

<section>
  <h2>⚽ OUR SQUAD</h2>
  <div class="squad">
