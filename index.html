<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONKOD FOOTBALL CLUB | Official Team Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(145deg, #131b2e, #0d1322);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e293b;
            text-align: center;
        }

        .club-header {
            margin-bottom: 20px;
        }

        .badge {
            background-color: #0088ff;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .captain-card {
            background: linear-gradient(135deg, rgba(0, 136, 255, 0.15), rgba(15, 23, 42, 0.4));
            border: 1.5px solid #0088ff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .captain-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ffb700;
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .captain-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0088ff;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.4);
        }

        .captain-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .captain-role {
            font-size: 13px;
            color: #38bdf8;
            font-weight: 600;
        }

        .section-title {
            text-align: left;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .player-item {
            display: flex;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            padding: 10px 16px;
            border-radius: 12px;
            transition: 0.2s ease;
        }

        .player-number {
            width: 34px;
            height: 34px;
            background-color: #0088ff;
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
        }

        .player-name {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            text-align: left;
            flex-grow: 1;
        }

        .footer {
            font-size: 12px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="club-header">
            <span class="badge">Official Squad 🇸🇴</span>
            <h1>ONKOD FOOTBALL CLUB</h1>
        </div>

        <!-- Captain Profile Card -->
        <div class="captain-card">
            <span class="captain-badge">CAPTAIN 👑</span>
            <!-- Sawirkaaga halkan ayuu ku jiraa -->
            <img class="captain-img" src="https://lh3.googleusercontent.com/d/1X1c64uJ9LqJ163Yx5n5i4x_S3x7X4Z2V" alt="Sadiek Kazim">
            <div class="captain-name">22. Sadiek Kazim 👑</div>
            <div class="captain-role">Captain & Team Leader</div>
        </div>

        <!-- Team Roster -->
        <div class="section-title">Kooxda / Squad List</div>
        <div class="player-list">
            <div class="player-item">
                <div class="player-number">4</div>
                <div class="player-name">Cabdi Nasir</div>
            </div>
            <div class="player-item">
                <div class="player-number">7</div>
                <div class="player-name">AameiN</div>
            </div>
            <div class="player-item">
                <div class="player-number">17</div>
                <div class="player-name">Maslax</div>
            </div>
            <div class="player-item">
                <div class="player-number">9</div>
                <div class="player-name">Sadiiq Yare</div>
            </div>
            <div class="player-item">
                <div class="player-number">8</div>
                <div class="player-name">Maxamed Deeq</div>
            </div>
            <div class="player-item">
                <div class="player-number">67</div>
                <div class="player-name">Suldan</div>
            </div>
            <div class="player-item">
                <div class="player-number">14</div>
                <div class="player-name">Cumar Cabdi</div>
            </div>
            <div class="player-item">
                <div class="player-number">5</div>
                <div class="player-name">Shaafici</div>
            </div>
            <div class="player-item">
                <div class="player-number">2</div>
                <div class="player-name">Maxamed Yare</div>
            </div>
            <div class="player-item">
                <div class="player-number">11</div>
                <div class="player-name">Sakariye</div>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 ONKOD FC. All Rights Reserved.
        </div>
    </div>

</body>
</html>
